name: Daily snow maps

on:
  schedule:
    - cron: '20 13 * * *'
    - cron: '20 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-maps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Keep the current maps
        run: |
          mkdir -p output
          for f in snow_map_season.png snow_map_72h.png; do
            curl -sfL -o "output/$f" \
              "https://raw.githubusercontent.com/${{ github.repository }}/maps/$f" || true
          done

      - name: Make the maps
        run: python make_snow_maps.py

      - name: Publish to the maps branch
        run: |
          cd output
          git init -q
          git checkout -q -b maps
          git add *.png
          git -c user.name="github-actions" \
              -c user.email="github-actions@users.noreply.github.com" \
              commit -q -m "Snow maps $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" maps
